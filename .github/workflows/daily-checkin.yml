name: Automatic daily check-in

on:
  schedule:
    - cron: '37 21 * * *'
      timezone: Europe/Paris
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-in:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check public contributions and log an automated check-in if needed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: bash .github/scripts/daily-checkin.sh

